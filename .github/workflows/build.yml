name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./build_mac.sh
      - uses: actions/upload-artifact@v6
        with:
          name: PhotoSorter-mac
          path: dist/PhotoSorter.dmg
